[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "EMeriTAte"
version = "0.0.1"
dependencies = ["loguru>=0.7.2", "pandas==1.4.2", "scikit-base==0.8.0", "scikit-image==0.21.0", "scikit-learn==1.2.1", "sktime==0.30.1", "sympy==1.12", "intervaltree==3.1.0"]

[tool.scikit-build]
wheel.packages = ["python/src/EMeriTAte"]
cmake.build-type = "Release"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
